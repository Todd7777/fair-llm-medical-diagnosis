efficientnet_v2:
  chestxray:
    data:
      batch_size: 64

    training:
      lr: 0.001
      epochs: 18
      weight_decay: .0001
      warmup_epochs: 3 # num warmup epochs, stepped per batch
      cosine_annealing:
        T_0: 15 # number of epochs it takes from max to min lr; inside batch loop lr is calculated using batch indexes
        eta_min: .0001

  pathology:
    data:
      batch_size: 64

    training:
      lr: 0.001
      epochs: 18
      weight_decay: .0001
      warmup_epochs: 3 # num warmup epochs, stepped per batch
      cosine_annealing:
        T_0: 15 # number of epochs it takes from max to min lr; inside batch loop lr is calculated using batch indexes
        eta_min: .0001

  retinal::
    data:
      batch_size: 64

    training:
      lr: 0.001
      epochs: 18
      weight_decay: .0001
      warmup_epochs: 3 # num warmup epochs, stepped per batch
      cosine_annealing:
        T_0: 15 # number of epochs it takes from max to min lr; inside batch loop lr is calculated using batch indexes
        eta_min: .0001

densenet: # apparantly needs more epochs than efficientnet v2
  chestxray:
    data:
      batch_size: 64

    training:
      lr: 0.0005
      epochs: 30
      weight_decay: .0001
      warmup_epochs: 5 # num warmup epochs, stepped per batch
      cosine_annealing:
        T_0: 25
        eta_min: .00005

