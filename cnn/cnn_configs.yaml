efficientnet_v2:
  data:
    batch_size: 64

  training:
    lr: 0.001
    epochs: 18
    weight_decay: .0001
    warmup_epochs: 2 # num warmup epochs, stepped per batch
    cosine_annealing:
      T_0: 16 # number of epochs it takes from max to min lr; inside batch loop lr is calculated using batch indexes
      eta_min: .0001

densenet: # apparantly needs more epochs than efficientnet v2
  data:
    batch_size: 64

  training:
    lr: 0.0005
    epochs: 30
    weight_decay: .0001
    warmup_epochs: 3 # num warmup epochs, stepped per batch
    cosine_annealing:
      T_0: 27
      eta_min: .00005

convnext: # often uses a cosine decay schedule
  data:
    batch_size: 64

  training:
    lr: 0.001
    epochs: 30
    weight_decay: .01
    warmup_epochs: 3 # num warmup epochs, stepped per batch
    cosine_annealing:
      T_0: 27
      eta_min: .0001
